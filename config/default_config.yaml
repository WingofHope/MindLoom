# config/default_config.yaml
# 
# 这是默认的配置文件。如果存在 config/config.yaml 文件，程序将优先读取 config/config.yaml 文件，
# 如果不存在，则会回退使用此默认配置文件。请根据需要修改此文件或创建一个 config/config.yaml 文件来覆盖默认配置。
# 
# 请确保修改时遵循相应的格式要求，详细的配置项说明请参见下面的注释。

log_config:
  # 日志输出的相关配置
  mode: "develop" # 可选值 "develop"表示开发环境会使用print,"product"表示生产环境不会使用print
  level: "debug"  # 可选值: "debug", "info", "warn", "error"
  path: "log/"   # 日志文件存储的路径

prompts:
  # 配置提示模板相关设置
  template_mode: "localfile"  # 模板的保存和读取方式。可选值：localfile, mongodb。默认使用 localfile。
  
  # 本地文件读取相关配置
  file_config:
    file_path: "prompts/"  # 提示模板本地存放路径
  
  # MongoDB 默认配置
  mongodb_config:
    host: "localhost"  # MongoDB 主机，默认值为 localhost
    port: 27017  # MongoDB 端口，0表示默认端口
    username: ""  # MongoDB 用户名，默认为空
    password: ""  # MongoDB 密码，默认为空
    db_name: "prompts"  # MongoDB 数据库名称，默认为空
    auth_source: ""  # MongoDB 认证源，默认为空
    connection_string: "mongodb://localhost:27017/prompts"  # 连接字符串

runtime_log:
  # 运行时日志输出相关配置
  log_mode: "localfile" #运行时日志存储方式。可选值：localfile, mongodb。默认使用 localfile。

  # 本地文件读取相关配置
  file_config:
    file_path: "log/runtime_log/"  # 提示模板本地存放路径

  # MongoDB 默认配置
  mongodb_config:
    host: "localhost"  # MongoDB 主机，默认值为 localhost
    port: 27017  # MongoDB 端口，0表示默认端口
    username: ""  # MongoDB 用户名，默认为空
    password: ""  # MongoDB 密码，默认为空
    db_name: "runtime_log"  # MongoDB 数据库名称，默认为空
    auth_source: ""  # MongoDB 认证源，默认为空
    connection_string: "mongodb://localhost:27017/runtime_log"  # 连接字符串

generator:
  # 配置LLM生成相关参数
  llm-provider:
    openai:  # OpenAI配置
      base_url: "https://gitaigc.com/v1"
      api_key: ""  # 替换为你的OpenAI API密钥

    baidu_wenxin_yiyan:  # 百度文心一言配置
      base_url: "https://aip.baidubce.com/rpc/2.0/unit/bot"  # API基础URL，实际可能需要根据官方文档调整
      api_key: "your_baidu_api_key"  # 百度API密钥
      secret_key: "your_baidu_secret_key"  # 百度Secret Key（某些API可能需要）
      bot_id: "your_bot_id"  # 百度机器人ID
   
    aliyun_tongyi_qianwen:  # 阿里云通义千问配置
      base_url: "https://your-aliyun-endpoint.com/"  # 阿里云提供的实际API端点
      access_key_id: "your_aliyun_access_key_id"  # 阿里云Access Key ID
      access_key_secret: "your_aliyun_access_key_secret"  # 阿里云Access Key Secret

#    gitaigc: # 中间人配置
#      base_url: "https://gitaigc.com/v1"  # 阿里云提供的实际API端点
#      access_key_id: "your_agitaigc_access_key_id"  # 阿里云Access Key ID
#      access_key_secret: ""  # 阿里云Access Key Secret


actions:
  # 配置操作调用方式
  action_mode: "rabbitmq"  # 操作调用方式。当前支持：localfile, REST_API, rabbitmq, mcp
  type:
    - "synchronous"  # 同步
    - "asynchronous"  # 异步
    - "callback"  # 回调
  REST_API_config:
    url: "http://localhost/mindloom_action"  # 默认 REST API URL
    headers:
      Authorization: "Bearer <API_TOKEN>"  # API 认证 token
  rabbitmq:
    username: "guest"  # RabbitMQ 用户名
    password: "guest"  # RabbitMQ 密码
    host: "localhost"  # RabbitMQ 主机
    port: 5672  # RabbitMQ 端口
  localfile:
    rootdir:"shared_mem" # default data/shared_mem

tools:
  # 配置工具的定义
  default_define: "local"  # 默认工具定义为本地
  local_define:
    file_path: "src/engine/executor/tool/tools"  # 工具文件存放路径

performance:
  # 引擎性能配置
  task:
    max_threads: 10  # 最大进程数
    max_executor_timeout: 6000  # 最大执行超时秒数

  process:
    sequential:
      max_unit: 10  # 顺序执行最大单位数
      max_executor_timeout: 600  # 最大执行超时秒数
    parallel:
      max_threads: 5  # 并行执行最大线程数
      max_executor_timeout: 60  # 最大执行超时秒数
    select:
      max_branch: 10  # 最大分支数
      max_executor_timeout: 60  # 最大执行超时秒数
    loop:
      max_loop_num: 100  # 最大循环次数
      max_executor_timeout: 60  # 最大执行超时秒数

encryption:
  # 配置文件中字段加密配置
  encryption_enabled: false # 是否启用配置文件字段加密机制
  strict_mode: true         # 是否强制校验解密（解密失败时终止程序）
  
  fields:
    # 需要加密的字段
    - "actions.REST_API_config.headers.Authorization"
    - "actions.rabbitmq.password"
    - "generator.llm-provider.aliyun_tongyi_qianwen.access_key_secret"
    - "generator.llm-provider.baidu_wenxin_yiyan.api_key"
    - "generator.llm-provider.baidu_wenxin_yiyan.secret_key"
    - "generator.llm-provider.openai.api_key"
    - "prompts.mongodb_config.password"
    - "runtime_log.mongodb_config.password"

  patterns:
    # 需要加密的
    - "password"    # 所有以最终字段名是password的字段
    - "*key"        # 所有最终字段名以key结尾的字段
    - "*secret"     # 所有最终字段名以secret结尾的字段